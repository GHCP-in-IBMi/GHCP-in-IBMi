<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="t d">
  <title id="t">GHCP in IBMi</title>
  <desc id="d">Animated banner showing Copilot flowing into an IBM i source member</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="900" height="220" rx="16" fill="url(#bg)"/>

  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#38bdf8" opacity="0.35">
    <text x="600" y="40">DCL-S name CHAR(10);</text>
    <text x="640" y="70">EXEC SQL SELECT *</text>
    <text x="610" y="100">DCL-PI *N; END-PI;</text>
    <text x="660" y="130">RETURN;</text>
    <text x="620" y="160">*INLR = *ON;</text>
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
  </g>

  <circle cx="90" cy="90" r="34" fill="#0b1220" stroke="url(#flow)" stroke-width="3"/>
  <text x="90" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">AI</text>
  <circle cx="90" cy="90" r="34" fill="none" stroke="#38bdf8" stroke-width="2">
    <animate attributeName="r" values="34;52;34" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <line x1="130" y1="90" x2="470" y2="90" stroke="url(#flow)" stroke-width="3" stroke-dasharray="8 8">
    <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <circle r="6" fill="#fde047">
    <animateMotion path="M130,90 L470,90" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <rect x="470" y="50" width="80" height="80" rx="10" fill="#0b1220" stroke="url(#flow)" stroke-width="3"/>
  <text x="510" y="86" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#a78bfa">IBM i</text>
  <text x="510" y="108" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">.MBR</text>

  <text x="40" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#f8fafc">GHCP in IBMi</text>
  <text x="330" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cbd5e1">Copilot rules, skills &amp; scripts for IBM i source work</text>
</svg>
